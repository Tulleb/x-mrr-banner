[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-mrr-banner"
version = "0.1.0"
description = "Update your X banner automatically with App Store and Google Play revenues"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "PyJWT[crypto]>=2.8",
  "google-cloud-storage>=2.14",
  "Pillow>=10.0",
  "Jinja2>=3.1",
  "requests-oauthlib>=1.3",
  "openai>=1.60",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
x-mrr-banner = "x_mrr_banner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
