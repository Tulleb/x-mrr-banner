name: Update X banner

on:
  schedule:
    # Monthly on the 2nd at 06:00 UTC (previous full calendar month; gives stores time to publish reports)
    - cron: "0 6 2 * *"
  workflow_dispatch:
    inputs:
      upload_to_x:
        description: Upload banner to X
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install .

      - name: Run update
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_REPORTS_BUCKET: ${{ secrets.GOOGLE_PLAY_REPORTS_BUCKET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS=(update)
          if [ "${{ inputs.upload_to_x }}" = "false" ]; then
            ARGS+=(--dry-run)
          fi
          python -m x_mrr_banner "${ARGS[@]}"

      - name: Upload banner artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banner-monthly
          path: output/
          if-no-files-found: ignore
